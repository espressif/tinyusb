name: pre-commit

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'

    - name: Checkout TinyUSB
      uses: actions/checkout@v6

    - name: Get Dependencies
      run: |
        gem install ceedling
        #cd test/unit-test
        #ceedling test:all

    - name: Run pre-commit
      uses: pre-commit/action@v3.0.1

    - name: Build Fuzzer
      run: |
        for attempt in 1 2 3; do
          sudo apt-get update && \
          sudo apt-get install -y --no-install-recommends libc++-dev libc++abi-dev && break

          if [ "$attempt" -eq 3 ]; then
            echo "apt install failed after $attempt attempts"
            exit 1
          fi

          echo "apt install failed, retrying in 15s..."
          sleep 15
        done
        clang --version
        export CC=clang
        export CXX=clang++
        fuzz_harness=$(ls -d test/fuzz/device/*/)
        for h in $fuzz_harness
        do
          make -C $h get-deps
          make -C $h all
        done
